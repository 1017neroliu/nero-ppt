[project]
name = "nero-ppt"
version = "0.1.0"
description = "轻量 Web PPT 生成工具：模板驱动的确定性渲染链路 + 受约束的模型内容生成"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
    "python-pptx>=0.6.23,<2",
    "python-docx>=1.0",
    "pypdf>=4.2,<6",
    "pillow>=10.0",
    "httpx>=0.27",
    "openai>=1.40",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
nero-ppt = "nero_ppt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
